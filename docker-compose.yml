services:
  mysql:
    image: mysql:8.4
    container_name: integra360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MySQL#2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-integra360}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: integra360-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-MySQL#2024!}@mysql:3306/${MYSQL_DATABASE:-integra360}
      JWT_SECRET: ${JWT_SECRET:-change_this_super_secret_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: integra360-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: