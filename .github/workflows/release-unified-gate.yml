name: Release Unified Gate

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  frontend-release-checks:
    name: Frontend release checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate table action grouping
        working-directory: frontend
        run: npm run check:table-actions

      - name: Validate Sidebar/Footer contrast
        working-directory: frontend
        run: npm run check:contrast:chrome

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-products-seed-release-checks:
    name: Backend products seed checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: integra360
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/integra360
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run products seed CI flow
        working-directory: backend
        run: npm run prisma:seed:products:ci

  release-publish-gate:
    name: Release publish gate
    runs-on: ubuntu-latest
    needs:
      - frontend-release-checks
      - backend-products-seed-release-checks
    if: always()

    steps:
      - name: Validate upstream job results
        run: |
          FRONTEND_RESULT="${{ needs.frontend-release-checks.result }}"
          BACKEND_RESULT="${{ needs.backend-products-seed-release-checks.result }}"

          echo "Frontend result: ${FRONTEND_RESULT}"
          echo "Backend result: ${BACKEND_RESULT}"

          if [ "${FRONTEND_RESULT}" != "success" ] || [ "${BACKEND_RESULT}" != "success" ]; then
            echo "Release gate failed because one or more required jobs did not pass."
            exit 1
          fi

          echo "Release gate passed."
